[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markdown-sorter"
version = "0.1.1"
description = "Safely sort Markdown notes into folders by tags, date, or keyword rules."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Xu Jiaqi", email = "jiaqixu12138@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
]
dependencies = [
    "click>=8.0.0",
    # 1.2 imports typing.TypeGuard, which is unavailable on Python 3.9.
    "python-frontmatter>=1.0.0,<1.2; python_version < '3.10'",
    "python-frontmatter>=1.0.0; python_version >= '3.10'",
    "pyyaml>=5.1",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
markdown-sorter = "markdown_sorter.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.9", "build>=1", "packaging>=20"]

[project.urls]
Homepage = "https://github.com/Master-626/markdown-sorter"
Repository = "https://github.com/Master-626/markdown-sorter"
Issue-Tracker = "https://github.com/Master-626/markdown-sorter/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
