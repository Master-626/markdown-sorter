name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # New runner images no longer provide the EOL Python 3.9 runtime.
          - os: ubuntu-22.04
            python-version: '3.9'
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: macos-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Exercise ordinary runtime installation before dev dependencies are present.
      - run: python -m pip install .
      - run: python -m pip check
      - run: python -c "import markdown_sorter.cli; import frontmatter"
      - run: markdown-sorter --version
      - run: markdown-sorter sort --help
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m build
